name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # anakin-language-server requires pyflakes 2.x, which doesn't support Python 3.14. The package creates the
      # server's virtual environment with the interpreter from the "python" setting. (On macOS, Sublime Text takes the
      # PATH from the login shell, so the PATH that setup-python sets wouldn't apply.)
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.13'

      - name: Use that Python for the server
        shell: bash
        run: |
          printf "settings:\n  LSP-anakin.sublime-settings:\n    python: '%s'\n" '${{ steps.python.outputs.python-path }}' >> tests/smoke/smoke.yaml
          cat tests/smoke/smoke.yaml

      - uses: sublimelsp/lsp_smoke_test@v1

  # A single check whose name doesn't depend on the os matrix, for rulesets to require. It runs even when the workflow
  # is cancelled: a skipped job counts as passing for a required check.
  result:
    name: Smoke test result
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check smoke test result
        env:
          RESULT: ${{ needs.smoke.result }}
        run: |
          echo "Smoke test result: $RESULT"
          test "$RESULT" = success
