name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Lets an organization variable choose the LSP ref to test against, see
      # https://github.com/sublimelsp/lsp_smoke_test#testing-against-an-lsp-branch
      LSP_SMOKE_TEST_LSP_REF: ${{ vars.LSP_SMOKE_TEST_LSP_REF }}
    steps:
      - uses: actions/checkout@v7

      # anakin-language-server requires pyflakes 2.x, which doesn't support Python 3.14. The package creates the
      # server's virtual environment with the interpreter from the "python" setting. (On macOS, Sublime Text takes the
      # PATH from the login shell, so the PATH that setup-python sets wouldn't apply.)
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.13'

      - name: Use that Python for the server
        shell: bash
        run: |
          printf "settings:\n  LSP-anakin.sublime-settings:\n    python: '%s'\n" '${{ steps.python.outputs.python-path }}' >> tests/smoke/smoke.yaml
          cat tests/smoke/smoke.yaml

      - uses: sublimelsp/lsp_smoke_test@v1
